<!DOCTYPE html>
<html>
<head>
    <title>Focus Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="dashboard-react/build/static/css/main.25a94a79.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        // Initialize the Qt WebChannel when the document is loaded
        document.addEventListener("DOMContentLoaded", function() {
            new QWebChannel(qt.webChannelTransport, function(channel) {
                // Make the Python handler available globally as window.pyHandler
                window.pyHandler = channel.objects.pyHandler;
                console.log("Qt WebChannel initialized, Python handler available");
                
                // Dispatch an event to notify React that the bridge is ready
                const event = new CustomEvent('qtReady');
                document.dispatchEvent(event);
            });
        });
    </script>
</head>
<body>
    <div id="root"></div>
    <script src="dashboard-react/build/static/js/main.e5a843cd.js"></script>
</body>
</html>
